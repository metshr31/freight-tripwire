name: Deploy independent scheduler
on:
  push:
    branches: [main]
    paths:
      - 'scheduler/**'
      - '.github/workflows/deploy-scheduler.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Cloudflare (false validates packaging without credentials)'
        type: boolean
        required: false
        default: false
permissions:
  contents: read
concurrency:
  group: freight-tripwire-scheduler-deployment
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: scheduler
    steps:
      - name: Checkout default branch
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: scheduler/package-lock.json
      - name: Install pinned deployment dependencies
        run: npm ci
      - name: Run scheduler tests
        run: |
          npm test
          python -m unittest test_deploy -v
      - name: Validate deployable Worker bundle without credentials
        run: npx --no-install wrangler deploy --dry-run --outdir "$RUNNER_TEMP/freight-scheduler-bundle"
      - name: Deploy Worker with encrypted dispatch credential
        if: inputs.deploy == true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_DISPATCH_TOKEN: ${{ secrets.TRIPWIRE_DISPATCH_TOKEN }}
          WRANGLER_SEND_METRICS: 'false'
          CI: 'true'
        run: python deploy.py
      - name: Explain verification status
        env:
          DEPLOY: ${{ inputs.deploy }}
        run: |
          if [[ "$DEPLOY" == 'true' ]]; then
            echo 'Worker deployment completed. Automatic scan verification is still pending; trigger propagation can take 15 minutes.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Tests and Worker packaging validated. This run did not deploy or scan sources.' >> "$GITHUB_STEP_SUMMARY"
          fi
