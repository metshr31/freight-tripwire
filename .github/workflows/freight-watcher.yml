name: Freight and STB Tripwire
on:
  schedule:
    # Weekdays every 20 minutes, 8:00 AM through 7:00 PM Eastern.
    - cron: '0,20,40 8-18 * * 1-5'
      timezone: 'America/New_York'
    - cron: '0 19 * * 1-5'
      timezone: 'America/New_York'
  workflow_dispatch:
    inputs:
      scheduled_for:
        description: 'External scheduler: exact intended UTC slot (ISO 8601); stale slots are refused'
        required: false
        type: string
      automatic:
        description: 'Apply operating window and slot guard (external scheduler must set true)'
        required: false
        type: boolean
        default: false
      test_push:
        description: 'Send a real test notification to ntfy (no baseline changes)'
        required: false
        type: boolean
        default: false
      pipeline_test:
        description: 'Run an isolated synthetic primary-source detection and real ntfy delivery test'
        required: false
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: freight-tripwire-state
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Queued runs must read the last committed monitoring state.
          ref: main
          persist-credentials: true
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check configuration
        run: python watcher.py --check-config
      - name: Run unit tests
        run: |
          python -m unittest discover -s tests -v
          node --test scheduler/worker.test.mjs
      - name: Configure state commit identity
        run: |
          git config user.name 'freight-tripwire[bot]'
          git config user.email 'freight-tripwire[bot]@users.noreply.github.com'
      - name: Claim slot and persist actual scan start
        id: admission
        if: inputs.test_push != true && inputs.pipeline_test != true
        env:
          SCHEDULED_FOR: ${{ inputs.scheduled_for }}
          MANUAL_SCAN: ${{ github.event_name == 'workflow_dispatch' && inputs.automatic != true }}
          SCAN_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python schedule_control.py begin
      - name: Run watcher or test notification
        id: watcher
        if: steps.admission.outputs.scan == 'true' || inputs.test_push == true || inputs.pipeline_test == true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
          TEST_PUSH: ${{ inputs.test_push }}
          PIPELINE_TEST: ${{ inputs.pipeline_test }}
        run: |
          if [[ "$PIPELINE_TEST" == 'true' ]]; then
            python smoke_test.py
          elif [[ "$TEST_PUSH" == 'true' ]]; then
            python watcher.py --test-push
          else
            python watcher.py
          fi
      - name: Record actual completion and last successful check
        if: always() && steps.admission.outputs.scan == 'true'
        env:
          SCAN_OUTCOME: ${{ steps.watcher.outcome }}
        run: |
          if [[ "$SCAN_OUTCOME" == 'success' ]]; then
            python schedule_control.py finish 0
          else
            python schedule_control.py finish 1
          fi
      - name: Commit durable state and alert log
        if: always()
        run: |
          git config user.name 'freight-tripwire[bot]'
          git config user.email 'freight-tripwire[bot]@users.noreply.github.com'
          for file in seen_items.json health.json alerts.jsonl schedule_status.json scan_history.jsonl; do
            if [[ -f "$file" ]]; then git add -- "$file"; fi
          done
          if ! git diff --staged --quiet; then
            git commit -m 'Save monitoring state and source health'
            for n in 1 2 3; do
              git pull --rebase origin main && git push origin HEAD:main && exit 0
              sleep "$((n * 2))"
            done
            echo 'State push failed after retries' >&2
            exit 1
          fi
      - name: Display durable scan status
        if: always()
        run: python schedule_control.py summary
